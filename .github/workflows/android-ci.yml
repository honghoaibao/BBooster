name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No gradle-version here on purpose: the project's wrapper pins Gradle 9.6.0, which AGP 9.5
      # requires. Running a globally installed `gradle` (e.g. 8.13) fails at plugin resolution.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          # Diagnostic: shows the exact package ids this sdkmanager offers for API 36/37.
          sdkmanager --list 2>/dev/null | grep -E 'platforms;android-3[67]' || true
          sdkmanager --install "build-tools;36.0.0"
          # compileSdk = 37. If this id is wrong, AGP downloads the platform itself (licenses are
          # accepted by setup-android), so a failure here is not fatal.
          sdkmanager --install "platforms;android-37" || echo "::warning::platforms;android-37 not installed by sdkmanager; relying on AGP auto-download"

      # Git on a phone / web upload can drop the executable bit.
      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests, lint, and build APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bbooster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbooster-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
