name: Replace repository from phase 1 ZIP
# User-authorized reset: clear project files and extract the retained archive.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-from-phase1-zip.yml"

permissions:
  contents: write

concurrency:
  group: replace-from-phase1-zip
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace project files with ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="bbooster-phase1.zip"
          test -f "$ZIP_FILE"

          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          import os, shutil

          archive = "bbooster-phase1.zip"
          workflow_backup = "/tmp/bbooster-workflows-backup"
          if os.path.isdir(".github/workflows"):
              shutil.copytree(".github/workflows", workflow_backup)

          with ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if not entries:
                  raise SystemExit("Archive contains no files.")

              names = [PurePosixPath(i.filename) for i in entries]
              first_parts = [p.parts[0] if p.parts else "" for p in names]
              strip = first_parts[0] if first_parts and first_parts[0] and len(set(first_parts)) == 1 and all(len(p.parts) > 1 for p in names) else None

              planned = []
              for info, path in zip(entries, names):
                  parts = path.parts[1:] if strip else path.parts
                  if not parts or any(part in ("", ".", "..") for part in parts):
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
                  if parts[0] == ".git":
                      raise SystemExit("Archive must not contain a .git directory.")
                  target = PurePosixPath(*parts).as_posix()
                  if target == archive or target.startswith(".github/workflows/"):
                      continue
                  planned.append((info, target))

              # Clear all current project files; keep the ZIP and workflow infrastructure.
              for name in os.listdir("."):
                  if name not in (".git", archive, ".github"):
                      if os.path.isdir(name) and not os.path.islink(name):
                          shutil.rmtree(name)
                      else:
                          os.remove(name)

              for info, target in planned:
                  dest = os.path.abspath(target)
                  root = os.path.abspath(".")
                  if os.path.commonpath([root, dest]) != root:
                      raise SystemExit(f"Archive path escapes repository: {target}")
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with z.open(info) as src, open(dest, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          # Restore existing workflows, which cannot be pushed by this GITHUB_TOKEN.
          if os.path.isdir(workflow_backup):
              if os.path.isdir(".github/workflows"):
                  shutil.rmtree(".github/workflows")
              shutil.copytree(workflow_backup, ".github/workflows")

          print(f"Extracted {len(planned)} files; preserved .github/workflows; wrapper: {strip or '(none)'}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi
          git commit -m "Replace project with bbooster phase 1 archive"
          git push origin HEAD:main
